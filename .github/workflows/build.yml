name: Arduino firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned toolchain and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install 'ArduinoJson@7.4.2' 'GFX Library for Arduino@1.6.3' 'PNGdec@1.1.6' 'JPEGDEC@1.8.2'
      - name: Native protocol and partition tests
        env:
          ARDUINOJSON_INCLUDE: /home/runner/Arduino/libraries/ArduinoJson/src
        run: tools/test.sh
      - name: PNG decoder regression (real pinned library)
        env:
          ARDUINOJSON_INCLUDE: /home/runner/Arduino/libraries/ArduinoJson/src
          PNGDEC_SRC: /home/runner/Arduino/libraries/PNGdec/src
        run: tools/test_png.sh
      - name: ESP32-S3 N16R8 build
        # build_opt.h supplies PNGdec's scanline size to every translation unit.
        run: arduino-cli compile --warnings all --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,PartitionScheme=custom' --output-dir build/export LEAP
      - name: Verify exported app image
        run: python3 tools/check_image.py build/export/LEAP.ino.bin
      - name: ESP32-S3 cable provisioning build
        run: |
          arduino-cli compile --warnings all --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,PartitionScheme=custom' --build-property 'compiler.cpp.extra_flags=-DLEAP_PROVISION_DEVICE=1' --output-dir build/provision LEAP
          python3 -c 'from pathlib import Path; data=Path("build/provision/LEAP.ino.bin").read_bytes(); assert b"LEAP_DEVICE_PROVISIONING_V1" in data and b"LEAP_UNIVERSAL_NVS_V1" not in data'
      - uses: actions/upload-artifact@v4
        with:
          name: leap-esp32s3-build
          path: build/export/
